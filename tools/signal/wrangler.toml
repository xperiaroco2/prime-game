# The signalling service's Worker (tools/signal/README.md). No secrets here: they go in the
# Cloudflare dashboard (the README's "Secrets"). Deployed by the engineer with `npx wrangler deploy`.
name = "prime-game-signal"
main = "src/worker.js"
# The docs say the runtime answers a client's close frame itself on or after 2026-04-07
# (web_socket_auto_reply_to_close), but it did not answer a close without a status on the first deploy
# (#513): SignalService.clientClosed answers every client's close.
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# What "room" and every "offer" carry (E58); service.js checks it by the clients' rules.
ICE_SERVERS = [{ urls = ["stun:stun.cloudflare.com:3478"] }]
# TURN (M6-10): on only when the secrets TURN_KEY_ID and TURN_KEY_API_TOKEN are set (never here).
# How long each joiner's credential lasts, in seconds (src/turn.js; D17's 600 s placeholder dropped a relayed player
# after 10 minutes): 4 hours, PR #499's item 2, recommended and accepted with the engineer's go on 2026-10-07.
TURN_TTL_SECONDS = 14400

[[durable_objects.bindings]]
name = "SIGNALLING"
class_name = "Signalling"

# The Workers Free plan has Durable Objects with the SQLite storage backend only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Signalling"]
