# The two steps every night job (nightly.yml) runs on its ref's checkout, after the toolchain setup: drop the TwoVoIP
# extension, then ask the ref's runner for the options the job calls. The job's env holds REF (the ref's name).
name: Prepare the night ref
description: Removes the TwoVoIP extension and checks that the ref's runner has the job's command and options.

inputs:
  calls:
    description: The runner command and its options the job calls, space separated ("bots --chaos --long").
    required: true

runs:
  using: composite
  steps:
    # Without the TwoVoIP extension, as in CI from M5 on (its ci.yml says why; the M5 voice ADR §2, E35 (a),
    # docs/decisions/2026-10-02-m5-voice-integrated-with-the-rules.md). On a ref without the addon this does nothing.
    - name: Remove the TwoVoIP extension
      shell: bash
      run: rm -f addons/twovoip/twovoip.gdextension addons/twovoip/twovoip.gdextension.uid

    # A ref whose runner is older than this file fails here, naming what it lacks, instead of running something else.
    # An option counts only on its own line of argparse's help ("  --long  ...", "  -s, --shards K"), not where
    # another option's help text mentions it ("--chaos: ...").
    - name: The ref's runner has the job's options
      shell: bash
      env:
        CALLS: ${{ inputs.calls }}
      run: |
        read -r command options <<< "$CALLS"
        help=$(tools/run.sh "$command" --help 2>&1) || true
        for option in $options; do
          if ! grep -qE -- "^  (-[A-Za-z0-9], )*$option( |,|\$)" <<< "$help"; then
            echo "$help"
            echo "::error::The runner of $REF has no '$command $option': this job needs a newer tools/runner there."
            exit 1
          fi
        done
