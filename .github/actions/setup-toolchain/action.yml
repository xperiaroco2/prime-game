# The pinned toolchain for a Linux job that runs the task runner: CI (ci.yml) and the night jobs (nightly.yml) share
# it, so the pins are read and checked in one place. Pins come from tools/runner/pins.py; see
# docs/decisions/2026-09-28-toolchain-pins.md. The job runs actions/checkout first (this action is in the repository).
# Godot ends up at ~/godot/godot: pass it as GODOT_BIN=$HOME/godot/godot.
name: Set up the pinned toolchain
description: Python 3.12, the checksum-checked Godot build and gdtoolkit from the pins.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Plain assignments first: under `bash -e` a failing `pins --get` stops this step (inside echo it would not).
    - name: Read pins
      shell: bash
      run: |
        zip=$(tools/run.sh pins --get godot_linux_zip)
        url=$(tools/run.sh pins --get godot_linux_url)
        sha512=$(tools/run.sh pins --get godot_linux_sha512)
        gdtoolkit=$(tools/run.sh pins --get gdtoolkit)
        {
          echo "GODOT_ZIP=$zip"
          echo "GODOT_URL=$url"
          echo "GODOT_SHA512=$sha512"
          echo "GDTOOLKIT_PIN=$gdtoolkit"
        } >> "$GITHUB_ENV"

    - name: Cache the Godot download
      id: godot-cache
      uses: actions/cache@v6
      with:
        path: ~/godot-download
        key: godot-linux-${{ env.GODOT_SHA512 }}

    - name: Download Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot-download
        curl -fsSL --retry 3 -o ~/godot-download/"$GODOT_ZIP" "$GODOT_URL"

    # Checked on every run, cached or not.
    - name: Check the Godot checksum and install it
      shell: bash
      run: |
        cd ~/godot-download
        echo "$GODOT_SHA512  $GODOT_ZIP" | sha512sum -c -
        mkdir -p ~/godot
        unzip -q -o "$GODOT_ZIP" -d ~/godot
        mv ~/godot/"${GODOT_ZIP%.zip}" ~/godot/godot
        chmod +x ~/godot/godot
        ~/godot/godot --headless --version

    - name: Install gdtoolkit
      shell: bash
      run: python -m pip install --disable-pip-version-check "gdtoolkit==$GDTOOLKIT_PIN"
