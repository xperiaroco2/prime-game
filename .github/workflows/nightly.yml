# Night jobs (docs/AGENT_WORKFLOW.md §15): long deterministic runs on GitHub's free runners while nobody works.
# `refs` picks the refs of the night: the run's own (main, on the schedule) and the newest remote release/* branch
# (#272), or only the ref given to workflow_dispatch. Each night job is a matrix over them: it checks out the ref's
# commit, sets up the toolchain like CI (.github/actions/setup-toolchain, the ref's own copy), checks that the ref's
# runner has the options the job calls, runs one runner command and uploads its reports under a name with the ref.
# `report` lists `refs` and every night job in `needs` and, when one of them fails, comments with the run link and
# each job of each ref on the standing "Night jobs" issue (creating it the first time).
# Adding a night job: copy the `flaky` job, change its command, the options its check needs, its artifact name and
# timeout, and add its id to `report`'s `needs`. `perf` (#187) also keeps its report for the next night of the same
# ref in a cache. `chaos` (#188) is the long chaos run with random seeds, each printed in its log.
# `lfs` (#1213) runs the two suites that need LFS content, with only their LFS files pulled (CI has none).
# `windows` (#1240) runs the runner's tests that start no Godot on windows-latest, through tools\run.cmd: its own
# setup (setup-python and PYTHON_BIN, no Godot, so not the shared action) and two runner calls (the gdtoolkit pin,
# then `selftest --group python`); the rest of the pattern above holds.
# Scheduled runs use this file and the latest commit of main and start late at busy times; a release ref's jobs still
# run the release's own tools/run.sh and tests. GitHub disables the schedule of a public repository after 60 days
# without activity (docs.github.com, "Events that trigger workflows").
name: Nightly

on:
  schedule:
    # 01:17 UTC every night (04:17 in Kyiv in summer time, 03:17 in winter time): off the hour, which GitHub delays
    # most, and well before the audit lens on the engineer's PC (Daily 06:00 local) reads the results.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Only this branch, tag or commit (empty: the run's own ref and the newest release/* branch)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refs:
    name: the refs of the night
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
      halves: ${{ steps.refs.outputs.halves }}
      list: ${{ steps.refs.outputs.list }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_REF: ${{ inputs.ref }}
    steps:
      # Each ref is resolved to a commit once, so its three jobs test the same commit. The newest release branch is
      # the last by version order (release/m10 after release/m9); none: the run's own ref alone. A ref name is
      # letters, digits and . _ / - only (so it goes into the JSON as it is); `slug` is the ref with / as -, for
      # the artifact names. `halves` is each ref twice, with `half` 1 and 2: the flaky job's matrix (#1065).
      - name: The run's ref and the newest release branch
        id: refs
        run: |
          plain='^[A-Za-z0-9._/-]+$'
          entries=()
          list=()
          add() {
            entries+=("{\"ref\":\"$1\",\"sha\":\"$2\",\"slug\":\"${1//\//-}\"}")
            list+=("\`$1\` at ${2:0:7}")
          }
          if [ -n "$INPUT_REF" ]; then
            if [[ ! "$INPUT_REF" =~ $plain ]]; then
              echo "::error::The ref '$INPUT_REF' holds a character other than letters, digits and . _ / -."
              exit 1
            fi
            if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${INPUT_REF//\//%2F}" --jq .sha); then
              echo "::error::No commit for the ref '$INPUT_REF' in $GITHUB_REPOSITORY."
              exit 1
            fi
            add "$INPUT_REF" "$sha"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ $plain ]]; then
              echo "::error::The run's ref '$GITHUB_REF_NAME' holds a character other than letters, digits and . _ / -."
              exit 1
            fi
            add "$GITHUB_REF_NAME" "$GITHUB_SHA"
            if ! releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/" \
                --jq '.[] | (.ref | ltrimstr("refs/heads/")) + " " + .object.sha'); then
              echo "::error::The release/* branches of $GITHUB_REPOSITORY could not be listed."
              exit 1
            fi
            newest=$(grep -E '^release/[A-Za-z0-9._/-]+ [0-9a-f]+$' <<< "$releases" | sort -V | tail -n 1 || true)
            if [ -z "$newest" ]; then
              echo "No remote release/* branch: $GITHUB_REF_NAME alone."
            else
              read -r name sha <<< "$newest"
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "$name is at $GITHUB_REF_NAME's commit: tested once, as $GITHUB_REF_NAME."
              else
                add "$name" "$sha"
              fi
            fi
          fi
          matrix=$(IFS=,; echo "{\"include\":[${entries[*]}]}")
          halves=()
          for entry in "${entries[@]}"; do
            for half in 1 2; do
              halves+=("${entry%\}},\"half\":$half}")
            done
          done
          joined=$(printf ', %s' "${list[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "halves=$(IFS=,; echo "{\"include\":[${halves[*]}]}")" >> "$GITHUB_OUTPUT"
          echo "list=${joined:2}" >> "$GITHUB_OUTPUT"
          echo "Refs of the night: ${joined:2}." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Matrix: $matrix"

  # One job per half of the suites (gdunit.half_of, as CI's verify --part test-1 and test-2, #980), each on its own
  # runner in 2 shards: the art House's suites outgrew one job's two real-time shards (#1065: nightly run
  # 38689352624, both shards killed at 645 s in all three runs; about 1400 s of suites a run, 600 s and 800 s a half).
  flaky:
    name: flaky on ${{ matrix.ref }}, half ${{ matrix.half }} (GdUnit4 three times)
    needs: refs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.halves) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REF: ${{ matrix.ref }}
    steps:
      # The ref's commit, not this run's: the ref's own tools/run.sh, setup action and tests. No LFS content, as in CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          lfs: false

      - uses: ./.github/actions/setup-toolchain

      # The TwoVoIP extension out and the ref's runner asked for the job's options (the action says why).
      - name: The ref's runner has the job's options
        uses: ./.github/actions/night-ref
        with:
          calls: test --repeat

      - name: doctor
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh doctor --quick

      # The newest per-suite GdUnit4 seconds (CI's or an earlier night's), by which the shards of each run are
      # balanced (tools/runner/gdunit.py, #182); the job saves its own at the end of a green job for the next night.
      # A new key every run, the half and the ref's slug in it so no two jobs reserve one key. An earlier night's
      # file of the same half first (its suites in real time, as this job runs them), then CI's of that half (#980:
      # `test-<half>`, saved by every green CI run), then any.
      - name: Restore the GdUnit4 suite times
        uses: actions/cache@v6
        with:
          path: tools/out/logs/gdunit-times.json
          key: gdunit-times-nightly-half${{ matrix.half }}-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gdunit-times-nightly-half${{ matrix.half }}-
            gdunit-times-test-${{ matrix.half }}-
            gdunit-times-

      # Every run is kept (tools/out/gdunit-runs/run-<i>/) and compared per suite and per test (summary.json, .md).
      # In real time, frame-bound suites too: verify runs those at fixed fps, where a frame never runs several
      # physics steps, the #222 class this job keeps covering (#341). No clock flag, so an older ref runs it.
      # Each run in 2 processes at once, as CI shards its suite (#817): one process outgrew the runner's 600 s
      # timeout per run when the suite grew (run 38120577422 of 2026-10-11, 3 x 600 s). PRIME_TEST_SHARDS is
      # read by `test` since #182 (--repeat since #817); a ref whose runner is older ignores it and runs one process.
      # PRIME_TEST_HALF (#1065) makes the run the job's half; a ref whose runner is older ignores it and runs all.
      - name: GdUnit4 three times
        env:
          PRIME_TEST_SHARDS: "2"
          PRIME_TEST_HALF: ${{ matrix.half }}
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh test --repeat 3

      - name: Job summary
        if: always()
        run: |
          if [ -f tools/out/gdunit-runs/summary.md ]; then
            cat tools/out/gdunit-runs/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the per-run reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-flaky-half${{ matrix.half }}-${{ matrix.slug }}
          path: |
            tools/out/gdunit-runs
            tools/out/logs
          if-no-files-found: ignore
          retention-days: 30

  perf:
    name: perf on ${{ matrix.ref }} (10 bots, compared with the last night)
    needs: refs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REF: ${{ matrix.ref }}
    steps:
      # The ref's commit, not this run's: the ref's own tools/run.sh, setup action and tests. No LFS content, as in CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          lfs: false

      - uses: ./.github/actions/setup-toolchain

      # The TwoVoIP extension out and the ref's runner asked for the job's options (the action says why).
      - name: The ref's runner has the job's options
        uses: ./.github/actions/night-ref
        with:
          calls: perf --baseline

      - name: doctor
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh doctor --quick

      # The last successful night's report of the same ref, saved by this step at the end of that night's job (a new
      # key every run, so each successful run saves; restore-keys takes the newest). A ref name never holds ":", so
      # one ref's prefix never matches another's keys. The cache needs no permission beyond the workflow's.
      - name: The last night's report
        uses: actions/cache@v6
        with:
          path: tools/out/perf-last
          key: "nightly-perf:${{ matrix.ref }}:${{ github.run_id }}"
          restore-keys: "nightly-perf:${{ matrix.ref }}:"

      # 10 bots over the loopback, a 60 s round; changes beyond the threshold are listed, never a failure.
      - name: perf
        run: |
          baseline=()
          if [ -f tools/out/perf-last/last.json ]; then baseline=(--baseline tools/out/perf-last/last.json); fi
          GODOT_BIN=$HOME/godot/godot tools/run.sh perf "${baseline[@]}"

      # A fresh checkout holds this run's report alone in tools/out/perf/ (the date is UTC).
      - name: Keep this report for the next night
        run: |
          mkdir -p tools/out/perf-last
          cp tools/out/perf/[0-9]*.json tools/out/perf-last/last.json

      - name: Job summary
        if: always()
        run: |
          if [ -f tools/out/perf/summary.md ]; then
            cat tools/out/perf/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-perf-${{ matrix.slug }}
          path: |
            tools/out/perf
            tools/out/logs
          if-no-files-found: ignore
          retention-days: 30

  chaos:
    name: chaos on ${{ matrix.ref }} (the long run, random seeds)
    needs: refs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REF: ${{ matrix.ref }}
    steps:
      # The ref's commit, not this run's: the ref's own tools/run.sh, setup action and tests. No LFS content, as in CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          lfs: false

      - uses: ./.github/actions/setup-toolchain

      # The TwoVoIP extension out and the ref's runner asked for the job's options (the action says why).
      - name: The ref's runner has the job's options
        uses: ./.github/actions/night-ref
        with:
          calls: bots --chaos --long --runs --enet

      - name: doctor
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh doctor --quick

      # Ten seeds from a random one (printed first: `tools/run.sh bots --chaos --long --seed <n>` replays a failed
      # one), each the baseline, the chaos run and the swapped roles of the long match, one process each.
      - name: chaos over the loopback
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh bots --chaos --long --runs 10

      # The ENet run's launch deletes every chaos_main-<n>.log first: keep the loopback run's (its seeds and
      # failures) under another name for the artifact.
      - name: Keep the loopback log
        if: always()
        run: |
          if [ -f tools/out/logs/run/chaos_main-1.log ]; then
            cp tools/out/logs/run/chaos_main-1.log tools/out/logs/chaos-loopback.log
          fi

      # Over ENet on 127.0.0.1 only the invariants hold (no crash, no engine error line, the leak check, the counters).
      - name: chaos over ENet
        if: success() || failure()
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh bots --chaos --long --enet

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-chaos-${{ matrix.slug }}
          path: tools/out/logs
          if-no-files-found: ignore
          retention-days: 30

  # The two suites that need LFS content (#1213, #877 e6): CI checks out with no LFS (the LFS ADR), so there they
  # print "skip" and check only that the GLB is a pointer. This job pulls the LFS files these suites load and nothing
  # else (11,938,695 bytes a ref: assets/characters/slice_m1/ and two House kit GLBs, about 12 MB a night, against
  # the 10 GiB of free LFS bandwidth a month), imports and runs them through the runner; red when either fails.
  lfs:
    name: lfs suites on ${{ matrix.ref }} (the art-bound tests, only their LFS files)
    needs: refs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REF: ${{ matrix.ref }}
      LFS_INCLUDE: assets/characters/slice_m1/**,assets/environment/house_kit/beam_concrete_1m.glb,assets/environment/house_kit/dormer_gable.glb
      LFS_SUITES: tests/integration/client/player/character_rig_art_test.gd tests/integration/levels/house_wrapper_test.gd
    steps:
      # The ref's commit, not this run's: the ref's own tools/run.sh, setup action and tests. No LFS content yet.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          lfs: false

      - uses: ./.github/actions/setup-toolchain

      # The TwoVoIP extension out and the ref's runner asked for the job's command (the action says why).
      - name: The ref's runner has the job's options
        uses: ./.github/actions/night-ref
        with:
          calls: test

      - name: doctor
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh doctor --quick

      # Only the paths of LFS_INCLUDE are downloaded and checked out in place of their pointer files; every other LFS
      # file stays a pointer, which `test`'s import sets aside in CI as in any CI job (#515). A suite without LFS
      # content prints "skip" and passes, so the pulled files are checked to be real content, not pointers: a failed
      # pull must turn this job red, not green. A ref older than the suites (no such test file) has nothing to run.
      - name: Pull only the LFS files of the suites
        id: pull
        run: |
          missing=0
          for suite in $LFS_SUITES; do
            if [ ! -f "$suite" ]; then
              echo "::notice::$REF has no $suite: nothing to run on it."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git lfs install --local
          git lfs pull --include="$LFS_INCLUDE"
          total=0
          count=0
          while IFS= read -r -d '' file; do
            if head -c 40 "$file" | grep -q '^version https://git-lfs'; then
              echo "::error::$file is still an LFS pointer file after git lfs pull."
              exit 1
            fi
            total=$((total + $(stat -c %s "$file")))
            count=$((count + 1))
          done < <(find assets/characters/slice_m1 assets/environment/house_kit/beam_concrete_1m.glb \
            assets/environment/house_kit/dormer_gable.glb \
            -type f \( -name '*.glb' -o -name '*.png' \) -print0)
          if [ "$count" -lt 3 ]; then
            echo "::error::Only $count LFS files with content after git lfs pull."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Pulled $count LFS files, $total bytes." | tee -a "$GITHUB_STEP_SUMMARY"

      # The import is the runner's own (`test` imports first). Named paths run in one process, in real time.
      - name: The LFS-bound suites
        if: steps.pull.outputs.run == 'true'
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh test $LFS_SUITES

      - name: Upload the reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-lfs-${{ matrix.slug }}
          path: |
            tools/out/gdunit
            tools/out/logs
          if-no-files-found: ignore
          retention-days: 30

  # The runner's own tests on Windows (#1240; the full analysis #1221, j5): every human and agent runs the runner
  # there (tools\run.cmd, PowerShell 5.1, taskkill, the sleep log), but CI runs Linux and a local verify runs no tests
  # (#605), so the tests that run only on Windows (skipUnless(IS_WINDOWS): run.cmd, `wait` from cmd and PowerShell,
  # the System log, `start`, the not-started detection) ran on no CI. This job runs the tests that start no Godot
  # (`selftest --group python`, as CI's minimum-Python job) through tools\run.cmd from Windows PowerShell 5.1, as a
  # human types it. No Godot, so not the shared setup (a Linux build): CI's Python 3.12 and the pinned gdtoolkit, and
  # no doctor (it checks the Godot build). Not a required check: a failure comments on the Night jobs issue.
  windows:
    name: windows on ${{ matrix.ref }} (the runner's tests that start no Godot, through tools\run.cmd)
    needs: refs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      REF: ${{ matrix.ref }}
    steps:
      # The ref's commit, not this run's: the ref's own tools\run.cmd and tests. No LFS content, as in CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # tools\run.cmd takes PYTHON_BIN first, else the py launcher, which the image has with other Pythons beside it:
      # every later step, the night-ref action's bash too, runs the interpreter set up above.
      - name: Hand the Python to the runner
        shell: bash
        run: |
          python=$(python -c 'import sys; print(sys.executable)')
          test "$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" = "3.12"
          echo "PYTHON_BIN=$python" >> "$GITHUB_ENV"

      # The TwoVoIP extension out (no Godot starts here: only so every night job is alike) and the ref's runner asked
      # for the job's options (the action says why).
      - name: The ref's runner has the job's options
        uses: ./.github/actions/night-ref
        with:
          calls: selftest --group

      # The pin read through tools\run.cmd: a broken wrapper fails here, before the tests.
      - name: Install gdtoolkit
        shell: powershell
        run: |
          $pin = tools\run.cmd pins --get gdtoolkit
          if ($LASTEXITCODE -ne 0 -or -not $pin) { throw "tools\run.cmd pins --get gdtoolkit failed (exit $LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check "gdtoolkit==$pin"

      - name: Runner tests that start no Godot
        shell: powershell
        run: tools\run.cmd selftest --group python

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-windows-${{ matrix.slug }}
          path: tools/out/logs
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report on the Night jobs issue
    needs: [refs, flaky, perf, chaos, lfs, windows]
    # A failed or timed-out night job of any ref, or no refs at all; a skipped one is not news. A matrix job's result
    # in `needs` is one for all its refs: the run's job list names the ref of each.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Night jobs
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS: ${{ toJSON(needs) }}
      REFS: ${{ needs.refs.outputs.list }}
    steps:
      - name: Comment with the run link
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -z "$number" ]; then
            body="The standing issue of the night jobs (docs/AGENT_WORKFLOW.md §15). The nightly workflow
          (.github/workflows/nightly.yml) comments here with the run link when a night job fails, and the night-audit
          skill posts its summary here each night. Keep it open: once it is closed, the next failure opens a new one."
            url=$(gh issue create --title "$TITLE" --label area:tooling --body "$body")
            number=${url##*/}
          fi
          # Each job of each ref with its conclusion (a night job's name holds its ref); if the list cannot be read,
          # the result of each job id from `needs`, which names no ref.
          if ! jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[]
              | select(.name != "report on the Night jobs issue") | "- `\(.name)`: \(.conclusion // .status)"'); then
            jobs=$(echo "$NEEDS" | jq -r 'to_entries[] | "- `\(.key)`: \(.value.result)"')
          fi
          {
            printf 'Nightly run failed: %s\n\n' "$RUN_URL"
            printf 'Refs: %s. Workflow commit %s on %s (%s).\n\n' \
              "${REFS:-none (the job \`refs\` failed)}" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_EVENT_NAME"
            printf '%s\n\n' "$jobs"
            printf 'Reports: the artifacts of the run, one per job and ref (`nightly-<job>-<ref, / as ->`; the flaky '
            printf 'job one per half too, `nightly-flaky-half<n>-<ref>`); the flaky job writes its per-suite '
            printf 'comparison and perf its numbers to the run summary.\n'
          } > comment.md
          gh issue comment "$number" --body-file comment.md
