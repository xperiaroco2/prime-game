# CI runs the whole suite, `tools/run.sh verify --full` (the definition of done's test gate), on Linux; a local
# `verify` runs only doctor, lint and check (#605, docs/decisions/2026-10-09-tests-on-ci-local-lint-and-check.md).
# Since #857 it runs in parts at once, a job each (`verify --full --part <name>`, the parts in tools/runner/verify.py
# PARTS), and the job named `verify`, the check the ruleset main-2 requires, is green only when every part was. Since
# #980 `test`, the longest part, runs as its two halves, the parts test-1 and test-2 (verify.HALVES, gdunit.half_of),
# and since #1013 the network runs as two parts: network-1 the ENet and loopback runs, network-2 the WebRTC ones.
# Since #1123 a pull request whose every changed path is on .github/design-only-paths.txt (Markdown design docs) skips
# the parts: the `changes` job decides, `verify` then accepts their `skipped`, and `runner on the minimum Python` lints
# it (the § references). The trigger keeps no path filter, so both required checks always report; pushes to main and
# release/**, a dispatch and the nightly run stay whole.
# Pins come from tools/runner/pins.py (read by .github/actions/setup-toolchain); see
# docs/decisions/2026-09-28-toolchain-pins.md.
name: CI

on:
  pull_request:
  push:
    # release/** (#622): `merge --base release/<x>` and `--sync-main` run no verify of the merged tree; this run does.
    branches: [main, release/**]
  workflow_dispatch:

concurrency:
  # A pull request's runs share one group and cancel each other; every other run (a push to main, a dispatch, the nightly)
  # gets its own, so a merge burst does not cancel the main runs still pending (#1241).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is the pull request design-only (#1123)? Every path its head changed since the merge base with its base (plain git,
  # no action: a new action is a dependency) matched against .github/design-only-paths.txt, which the runner's
  # design_only.py reads too; in bash every `*` of a pattern matches any characters, `/` included, as in fnmatch. Fail
  # safe: a push, a dispatch, an empty or failed diff, an empty list or one path on no line is `false`, and so is a
  # change to the list (on no line); a red or skipped job leaves the output empty, and the parts run.
  changes:
    name: design-only paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      design_only: ${{ steps.diff.outputs.design_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0

      - name: Is every changed path on the design-only list
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          design_only=false
          changed=""
          if [ "$EVENT" = pull_request ] && [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            changed=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE...$HEAD") || changed=""
          fi
          if [ -n "$changed" ]; then
            design_only=true
            # Each line trimmed, blank and `#` lines dropped: as design_only.patterns() reads the file.
            mapfile -t patterns < <(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' .github/design-only-paths.txt | grep -v -e '^#' -e '^$' || true)
            if [ "${#patterns[@]}" -eq 0 ]; then
              echo "no pattern in .github/design-only-paths.txt"
              design_only=false
            fi
            while [ "$design_only" = true ] && IFS= read -r path; do
              hit=false
              for pattern in "${patterns[@]}"; do
                # The pattern unquoted: a glob, not a string.
                if [[ $path == $pattern ]]; then
                  hit=true
                  break
                fi
              done
              if [ "$hit" = false ]; then
                echo "not on the design-only list: $path"
                design_only=false
              fi
            done <<< "$changed"
          fi
          echo "design-only: $design_only"
          echo "design_only=$design_only" >> "$GITHUB_OUTPUT"

  # One job per part of verify --full; the list is verify.PARTS' names (test_github_workflows checks it), and each
  # part's steps come from the runner, so no step is listed here. Every part runs to its end when another is red, as
  # every step of one verify does.
  part:
    name: verify ${{ matrix.part }}
    needs: changes
    # Skipped for a design-only pull request (#1123); run when `changes` is red (its output then empty).
    if: ${{ !cancelled() && needs.changes.outputs.design_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [test-1, test-2, network-1, network-2, runner]
    steps:
      # No LFS content: addons/ is outside LFS, and in CI `check` imports a stand-in in place of each LFS pointer
      # file (the LFS ADR's amendment of 2026-10-07, #515).
      - uses: actions/checkout@v7
        with:
          lfs: false

      # Python, the checksum-checked Godot build and gdtoolkit from the pins; nightly.yml uses the same action.
      - uses: ./.github/actions/setup-toolchain

      # The last run's per-suite GdUnit4 seconds, by which `test` balances its shards (tools/runner/gdunit.py, #182).
      # A new key every run, saved after a green job: a run restores the newest one of its branch, else of main's.
      # Only the parts that run `test`'s halves read and write them, so no other part saves a stale copy; each under
      # keys of its own (#980: two jobs saving one key race, and the second save is lost), restoring its own part's
      # newest only: the other half's file times few of this half's suites, so the shard timeout it sets is too short
      # (PR #1542: its first test-2 failed, every rerun restored test-1's file, "about 279s", and the 600 s shards
      # timed out at about 650 s of work, #1509). A branch with none of its own part's restores main's.
      - name: Restore the GdUnit4 suite times
        if: matrix.part == 'test-1' || matrix.part == 'test-2'
        uses: actions/cache@v6
        with:
          path: tools/out/logs/gdunit-times.json
          key: gdunit-times-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gdunit-times-${{ matrix.part }}-

      # CI on Linux runs without the TwoVoIP addon (docs/decisions/2026-10-02-m5-voice-integrated-with-the-rules.md
      # §2, E35 (a)): only its Windows libraries are committed, and Godot prints an ERROR: line for a .gdextension it
      # cannot load. Removing the .gdextension (and its .uid) is enough for Godot to load nothing; the inert libraries
      # stay, so the credits check still finds the files docs/credits/twovoip.md names. Voice is then unavailable (E34).
      # The webrtc-native extension stays on purpose: it ships a Linux library, which loads headless, and its smoke
      # test needs it (docs/decisions/2026-10-04-m6-playable-over-the-internet.md, E57; #367).
      - name: Remove the TwoVoIP extension
        run: rm addons/twovoip/twovoip.gdextension addons/twovoip/twovoip.gdextension.uid

      # Its test step runs the frame-bound client suites (gdunit.FIXED_FPS_SUITES) at --fixed-fps 60 in shards of
      # their own and the rest in real time (#341); nightly.yml's flaky job keeps all of them real-time.
      - name: verify
        env:
          PART: ${{ matrix.part }}
        run: GODOT_BIN=$HOME/godot/godot tools/run.sh verify --full --part "$PART"

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-reports-${{ matrix.part }}
          path: |
            tools/out/gdunit
            tools/out/logs
          if-no-files-found: ignore
          retention-days: 14

  # The required check `verify` (#857): green only when every part's job ended green. `always()` makes it run, and
  # so report, when a part failed, was cancelled or was skipped; its step then fails (needs.part.result is success
  # only when every job of the matrix succeeded), except for a design-only pull request (#1123), whose parts the
  # `changes` job skipped: there `skipped` is green.
  verify:
    name: verify
    needs: [changes, part]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every part
        env:
          RESULT: ${{ needs.part.result }}
          DESIGN_ONLY: ${{ needs.changes.outputs.design_only }}
        run: |
          echo "the parts of verify --full: $RESULT"
          if [ "$DESIGN_ONLY" = true ] && [ "$RESULT" = skipped ]; then
            echo "a design-only pull request (#1123): its parts were skipped"
            exit 0
          fi
          test "$RESULT" = success

  # The runner on its stated minimum Python (tools/runner/pins.py PYTHON_MIN; the python-task-runner ADR), which the
  # verify parts' 3.12 never runs: 3.12-only code broke verify in a cloud session on 3.11 (#345, #349). Every runner
  # file must compile there, and the runner tests that start no Godot (verify's Python lane) must pass; no Godot here.
  # A design-only pull request (#1123) also gets its lint here (the instruction files and the docs' § references), as
  # the part that lints is skipped; `!cancelled()` runs the job, and so reports the required check, when `changes` is
  # red.
  python-min:
    name: runner on the minimum Python
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      # The image's own python3 reads the pin, so the version is written in one place. A plain assignment first: under
      # `bash -e` a failing `pins --get` stops this step (inside echo it would not, and an empty version would let
      # setup-python fall back to the image's 3.12).
      - name: Read the minimum Python
        id: pins
        run: |
          python=$(tools/run.sh pins --get python_min)
          gdtoolkit=$(tools/run.sh pins --get gdtoolkit)
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "gdtoolkit=$gdtoolkit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}

      # Every later step runs this interpreter: `python` here, and PYTHON_BIN for tools/run.sh (which would otherwise
      # take the first python3 on PATH). Its version must be the pin's, or the job proves nothing.
      - name: Check the Python version
        run: |
          echo "PYTHON_BIN=$(command -v python)" >> "$GITHUB_ENV"
          test "$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" = "${{ steps.pins.outputs.python }}"

      - name: Install gdtoolkit
        run: python -m pip install --disable-pip-version-check "gdtoolkit==${{ steps.pins.outputs.gdtoolkit }}"

      - name: Compile every runner file
        run: python -m compileall -q tools

      - name: Runner tests that start no Godot
        run: tools/run.sh selftest --group python

      - name: Lint a design-only pull request
        if: needs.changes.outputs.design_only == 'true'
        run: tools/run.sh lint
